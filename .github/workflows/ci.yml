# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main]
  merge_group:            # runs on the temp branch GitHub builds: main + PRs ahead + your PR
    types: [checks_requested]

jobs:
  test:
    name: test            # must match the required status check name
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
